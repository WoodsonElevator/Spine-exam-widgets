<div id="lxw" style="font-family:system-ui,sans-serif;font-size:13px;max-width:660px;margin:0 auto;background:#f8fafc;padding:10px;border-radius:10px;">
<div style="background:#1a4731;color:#fff;padding:9px 14px;border-radius:8px 8px 0 0;margin-bottom:10px;"><div style="font-size:15px;font-weight:700;">Lumbar Spine — Neurological Exam</div><div style="font-size:11px;opacity:.7;margin-top:2px;">Complete all sections then Submit.</div></div>
<div id="lxr"></div></div>
<script>
var X={};
var DR=[{i:'l1',l:'L1',s:'inguinal'},{i:'l2',l:'L2',s:'ant thigh'},{i:'l3',l:'L3',s:'med knee'},{i:'l4',l:'L4',s:'med ankle'},{i:'l5',l:'L5',s:'dorsal foot'},{i:'s1',l:'S1',s:'lat foot'},{i:'s2',l:'S2–S4',s:'perianal'}];
var MY=[{i:'ili',l:'Hip flexion',s:'L1/L2'},{i:'qd',l:'Knee extension',s:'L3/L4'},{i:'tib',l:'Ankle dorsiflexion',s:'L4'},{i:'ehl',l:'Great toe ext (EHL)',s:'L5'},{i:'gas',l:'Plantar flexion',s:'S1'},{i:'gl',l:'Hip abduction',s:'S1'},{i:'ham',l:'Knee flexion',s:'S1/S2'}];
var SQ=['Dim','Abs','Hyp'],SF={Dim:'Diminished',Abs:'Absent',Hyp:'Hyperesthesia'};
var SG=['4/5','3/5','2/5','1/5','0/5'];
var SC={Dim:'background:#fef3c7;color:#92400e;border-color:#f59e0b;',Abs:'background:#fee2e2;color:#991b1b;border-color:#dc2626;',Hyp:'background:#ede9fe;color:#5b21b6;border-color:#7c3aed;','4/5':'background:#fef3c7;color:#92400e;border-color:#f59e0b;','3/5':'background:#fed7aa;color:#9a3412;border-color:#f97316;','2/5':'background:#fee2e2;color:#991b1b;border-color:#ef4444;','1/5':'background:#fce7f3;color:#9d174d;border-color:#ec4899;','0/5':'background:#f3e8ff;color:#6b21a8;border-color:#a855f7;'};
var BY='border:1px solid #16a34a;background:#dcfce7;color:#15803d;font-weight:700;';
var BN='border:1px solid #dc2626;background:#fee2e2;color:#dc2626;font-weight:700;';
var BB='border:1px solid #cbd5e1;background:#f1f5f9;color:#475569;';
function g(k){return X[k]||'';}
function sv(k,v){X[k]=v;R();}
function tg(k,v){X[k]=X[k]===v?'':v;R();}
function sc(id,sd){var k='sn-'+id+'-'+sd,p=g('sp')||'Dim';X[k]=X[k]===p?'':p;R();}
function mc(id,sd){var k='st-'+id+'-'+sd,p=g('mp')||'4/5';X[k]=X[k]===p?'':p;R();}
function btn(lbl,clk,st){return '<button onclick="'+clk+'" style="cursor:pointer;border-radius:5px;font-size:11px;padding:3px 10px;font-family:inherit;'+st+'">'+lbl+'</button>';}
function card(t,b){return '<div style="border:1px solid #e2e8f0;border-radius:8px;margin-bottom:10px;overflow:hidden;"><div style="background:#f0fdf4;padding:8px 13px;font-size:12px;font-weight:700;color:#1a4731;border-bottom:1px solid #e2e8f0;">'+t+'</div><div style="padding:11px 13px;background:#fff;">'+b+'</div></div>';}
function secB(k){var v=g('s'+k);return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;"><span style="font-size:12px;color:#64748b;min-width:68px;">Overall:</span>'+btn('Normal',"sv('s"+k+"','n')",v==='n'?BY:BB)+btn('Abnormal',"sv('s"+k+"','a')",v==='a'?BN:BB)+'</div>';}
function TA(id,ph){return '<textarea rows="2" placeholder="'+ph+'" style="width:100%;box-sizing:border-box;padding:6px 9px;border-radius:6px;border:1px solid #e2e8f0;font-size:12px;font-family:inherit;resize:vertical;margin-top:7px;" oninput="X[\'ta'+id+'\']=this.value">'+(X['ta'+id]||'')+'</textarea>';}
function mkGrid(stamps,items,picker,pfx,clickFn){
  var pk=g(picker)||stamps[0];
  var bar='<div style="display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap;"><span style="font-size:11px;color:#64748b;">Stamp:</span>'+stamps.map(function(v){var on=SC[v]?SC[v]+'font-weight:700;border-radius:5px;font-size:11px;padding:3px 10px;cursor:pointer;font-family:inherit;':BY;return btn(v,"sv('"+picker+"','"+v+"')",pk===v?on:BB);}).join('')+'<span style="font-size:10px;color:#d1d5db;margin-left:3px;">tap cell · again to clear</span></div>';
  var rows=items.map(function(m){
    var l=g(pfx+m.i+'-L'),r=g(pfx+m.i+'-R');
    var lc=l?SC[l]+'font-weight:700;':'background:#f3f4f6;color:#d1d5db;';
    var rc=r?SC[r]+'font-weight:700;':'background:#f3f4f6;color:#d1d5db;';
    return '<tr><td style="padding:2px 5px;"><div style="font-size:12px;font-weight:500;">'+m.l+'</div><div style="font-size:10px;color:#94a3b8;">'+m.s+'</div></td>'
      +'<td style="padding:2px;"><button onclick="'+clickFn+'(\''+m.i+'\',\'L\')" style="width:100%;padding:5px 2px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid #e5e7eb;'+lc+'">'+(l||'—')+'</button></td>'
      +'<td style="padding:2px;"><button onclick="'+clickFn+'(\''+m.i+'\',\'R\')" style="width:100%;padding:5px 2px;border-radius:5px;cursor:pointer;font-size:12px;border:1px solid #e5e7eb;'+rc+'">'+(r||'—')+'</button></td></tr>';
  }).join('');
  return bar+'<div style="overflow-x:auto;"><table style="border-collapse:separate;border-spacing:3px;width:100%;"><tr><th></th><th style="font-size:11px;color:#64748b;font-weight:600;text-align:center;min-width:65px;">Left</th><th style="font-size:11px;color:#64748b;font-weight:600;text-align:center;min-width:65px;">Right</th></tr>'+rows+'</table></div>';
}
function senSec(){var v=g('ssen');return secB('sen')+(v==='a'?mkGrid(SQ,DR,'sp','sn-','sc')+TA('sen','e.g. burning dysesthesia L5 left…'):'');}
function strSec(){var v=g('sstr');return secB('str')+(v==='a'?mkGrid(SG,MY,'mp','st-','mc')+TA('str','e.g. give-way weakness left EHL…'):'');}
function rrow(lbl,lvl,k){
  var nm=g(k+'-nm'),l=g(k+'-L'),r=g(k+'-R'),RF={Dim:'diminished',Abs:'absent',HH:'hyperreflexic'};
  var det=nm==='a'?'<div style="display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap;"><span style="font-size:11px;color:#94a3b8;">L:</span>'
    +['Dim','Abs','HH'].map(function(f){return btn(f==='HH'?'Hyp':f,"tg('"+k+"-L','"+f+"')",l===f?BN:BB);}).join('')
    +'<span style="font-size:11px;color:#94a3b8;margin-left:4px;">R:</span>'
    +['Dim','Abs','HH'].map(function(f){return btn(f==='HH'?'Hyp':f,"tg('"+k+"-R','"+f+"')",r===f?BN:BB);}).join('')+'</div>':'';
  return '<div style="border:1px solid #f0f0f0;border-radius:7px;padding:8px 10px;margin-bottom:6px;background:#fff;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><div style="flex:1;font-size:13px;font-weight:500;">'+lbl+' <span style="font-size:10px;color:#94a3b8;">'+lvl+'</span></div>'
    +btn('Normal bilat',"tg('"+k+"-nm','n')",nm==='n'?BY:BB)+btn('Abnormal',"tg('"+k+"-nm','a')",nm==='a'?BN:BB)+'</div>'+det+'</div>';
}
function slrBlock(){
  var lV=g('slL'),rV=g('slR'),ang=g('ang')||'50',show=lV==='pos'||rV==='pos';
  return '<div style="border:1px solid #f0f0f0;border-radius:7px;padding:8px 10px;margin-bottom:6px;background:#fff;">'
    +'<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><div style="flex:1;font-size:13px;font-weight:500;">SLR <span style="font-size:10px;color:#94a3b8;">straight leg raise</span></div>'
    +'<span style="font-size:11px;color:#94a3b8;">L:</span>'+btn('Pos',"tg('slL','pos')",lV==='pos'?BN:BB)+btn('Neg',"tg('slL','neg')",lV==='neg'?BY:BB)
    +'<span style="font-size:11px;color:#94a3b8;margin-left:4px;">R:</span>'+btn('Pos',"tg('slR','pos')",rV==='pos'?BN:BB)+btn('Neg',"tg('slR','neg')",rV==='neg'?BY:BB)+'</div>'
    +(show?'<div style="display:flex;align-items:center;gap:8px;margin-top:7px;"><span style="font-size:12px;color:#555;">Positive at</span><input type="number" min="10" max="90" value="'+ang+'" oninput="X[\'ang\']=this.value" style="width:52px;padding:4px 7px;border-radius:5px;border:1px solid #e2e8f0;font-size:13px;text-align:center;"><span style="font-size:12px;color:#555;">degrees</span><span style="font-size:10px;color:#d1d5db;">(default 50°)</span></div>':'')
    +'</div>';
}
function refSec(){
  var v=g('sref');
  if(v!=='a') return secB('ref');
  return secB('ref')+rrow('Patellar','L4','pat')+rrow('Achilles','S1','ach')
    +'<div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 5px;">Straight Leg Raise</div>'
    +slrBlock()+TA('ref','e.g. crossed SLR positive, femoral stretch test positive left…');
}
function R(){
  document.getElementById('lxr').innerHTML=
    card('Sensation (L1–S2/4)',senSec())
    +card('Strength (L1–S2)',strSec())
    +card('Reflexes &amp; SLR',refSec())
    +'<button onclick="SUB()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#1a4731;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:2px;">Submit Exam →</button>';
}
function SUB(){
  var L=[],RF={Dim:'diminished',Abs:'absent',HH:'hyperreflexic'};
  var sn=g('ssen'),ss=g('sstr'),sr=g('sref');
  if(sn==='n'){L.push('Sensation: Intact throughout bilateral lower extremities.');}
  else if(sn==='a'){
    var a=[];DR.forEach(function(lv){var l=g('sn-'+lv.i+'-L'),r=g('sn-'+lv.i+'-R');if(!l&&!r)return;if(l&&r&&l===r)a.push(lv.l+' ('+lv.s+'): '+SF[l]+' bilaterally');else{if(l)a.push(lv.l+' ('+lv.s+'): '+SF[l]+' left');if(r)a.push(lv.l+' ('+lv.s+'): '+SF[r]+' right');}});
    L.push('Sensation: '+(a.length?a.join('; ')+'. Remainder intact.':'Abnormal — see comments.'));
    if(X.tasen&&X.tasen.trim())L.push('  '+X.tasen.trim());
  }
  if(ss==='n'){L.push('Strength: 5/5 throughout bilateral lower extremities.');}
  else if(ss==='a'){
    var b=[];MY.forEach(function(m){var l=g('st-'+m.i+'-L'),r=g('st-'+m.i+'-R');if(!l&&!r)return;if(l&&r&&l===r)b.push(m.l+' ('+m.s+'): '+l+' bilaterally');else{if(l)b.push(m.l+' ('+m.s+'): '+l+' left');if(r)b.push(m.l+' ('+m.s+'): '+r+' right');}});
    L.push('Strength: '+(b.length?b.join('; ')+'. Remainder 5/5.':'Abnormal — see comments.'));
    if(X.tastr&&X.tastr.trim())L.push('  '+X.tastr.trim());
  }
  function RL(k,lb,lv){var nm=g(k+'-nm'),l=g(k+'-L'),r=g(k+'-R');if(nm==='n')return lb+' ('+lv+'): normal bilaterally';if(!l&&!r)return lb+' ('+lv+'): abnormal';if(l&&r&&l===r)return lb+' ('+lv+'): '+(RF[l]||l)+' bilaterally';var p=[];if(l)p.push((RF[l]||l)+' left');if(r)p.push((RF[r]||r)+' right');return lb+' ('+lv+'): '+p.join(', ');}
  if(sr==='n'){L.push('Reflexes: Patellar (L4) and Achilles (S1) symmetric and intact bilaterally.');L.push('SLR: Negative bilaterally.');}
  else if(sr==='a'){
    L.push('Reflexes: '+RL('pat','Patellar','L4')+'; '+RL('ach','Achilles','S1')+'.');
    var lV=g('slL'),rV=g('slR'),ang=g('ang')||'50',sp=[];
    if(lV==='pos')sp.push('positive left at '+ang+'°');if(rV==='pos')sp.push('positive right at '+ang+'°');
    if(lV==='neg'&&rV==='neg')L.push('SLR: Negative bilaterally.');else if(sp.length)L.push('SLR: '+sp.join(', ')+', reproducing radicular symptoms.');
    if(X.taref&&X.taref.trim())L.push(X.taref.trim());
  }
  var note=L.join('\n');
  window.parent.postMessage({type:'exam-submit',exam:'lumbar',note:note},'*');
  if(typeof sendPrompt==='function')sendPrompt('LUMBAR EXAM SUBMITTED:\n'+note);
  document.getElementById('lxw').innerHTML='<div style="padding:20px;text-align:center;color:#16a34a;font-weight:700;font-size:14px;">✓ Submitted.<br><br><pre style="text-align:left;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px;font-size:12px;line-height:1.7;white-space:pre-wrap;font-family:system-ui,sans-serif;color:#111;">'+note+'</pre></div>';
}
R();
</script>
